name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: auth-service
  PASSWORD_TOOL_NAME: generate_password_hash

jobs:
  release:
    name: Build Linux release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify version increase
        id: version
        shell: bash
        run: |
          current_version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          previous_version=$(git show HEAD^:Cargo.toml 2>/dev/null \
            | awk -F '"' '/^version = "/ { print $2; exit }' || true)
          previous_version=${previous_version:-0.0.0}

          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml version must use the x.y.z format: $current_version" >&2
            exit 1
          fi

          highest_version=$(printf '%s\n' "$previous_version" "$current_version" \
            | sort -V | tail -n 1)
          if [[ "$current_version" == "$previous_version" || "$current_version" != "$highest_version" ]]; then
            echo "Version must increase: $previous_version -> $current_version" >&2
            exit 1
          fi

          release_tag="v$current_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag already exists: $release_tag" >&2
            exit 1
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build static musl release binaries
        run: |
          docker build \
            --file Dockerfile.musl \
            --target artifact \
            --output type=local,dest=dist \
            .

      - name: Verify release binaries are statically linked
        run: |
          file dist/auth-service dist/generate_password_hash
          if readelf -d dist/auth-service | grep -q '(NEEDED)'; then
            echo "auth-service has shared-library dependencies" >&2
            exit 1
          fi
          if readelf -d dist/generate_password_hash | grep -q '(NEEDED)'; then
            echo "generate_password_hash has shared-library dependencies" >&2
            exit 1
          fi

      - name: Package release assets
        env:
          SERVICE_ARCHIVE: ${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-linux-x86_64-musl.tar.gz
          TOOL_ARCHIVE: ${{ env.PASSWORD_TOOL_NAME }}-${{ steps.version.outputs.tag }}-linux-x86_64-musl.tar.gz
        run: |
          tar -C dist -czf "$SERVICE_ARCHIVE" "$BINARY_NAME"
          tar -C dist -czf "$TOOL_ARCHIVE" "$PASSWORD_TOOL_NAME"
          sha256sum "$SERVICE_ARCHIVE" > "$SERVICE_ARCHIVE.sha256"
          sha256sum "$TOOL_ARCHIVE" > "$TOOL_ARCHIVE.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SERVICE_ARCHIVE: ${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-linux-x86_64-musl.tar.gz
          TOOL_ARCHIVE: ${{ env.PASSWORD_TOOL_NAME }}-${{ steps.version.outputs.tag }}-linux-x86_64-musl.tar.gz
        run: |
          gh release create "$RELEASE_TAG" \
            "$SERVICE_ARCHIVE" \
            "$SERVICE_ARCHIVE.sha256" \
            "$TOOL_ARCHIVE" \
            "$TOOL_ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "$BINARY_NAME ${{ steps.version.outputs.version }}" \
            --generate-notes
