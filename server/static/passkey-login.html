<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>passkey login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="icon" href="/favicon.ico" />
  <link href="https://fonts.googleapis.com/css?family=Anton" rel="stylesheet">
  <script>
    function base64urlToBuffer(value) {
      const base64 = value.replace(/-/g, "+").replace(/_/g, "/")
      const padded = base64 + "=".repeat((4 - base64.length % 4) % 4)
      const binary = atob(padded)
      const bytes = new Uint8Array(binary.length)
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i)
      }
      return bytes.buffer
    }

    function bufferToBase64url(buffer) {
      if (!buffer) {
        return ""
      }
      const bytes = new Uint8Array(buffer)
      let binary = ""
      for (const byte of bytes) {
        binary += String.fromCharCode(byte)
      }
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "")
    }

    function requestOptionsFromJSON(options) {
      options.publicKey.challenge = base64urlToBuffer(options.publicKey.challenge)
      if (options.publicKey.allowCredentials) {
        options.publicKey.allowCredentials = options.publicKey.allowCredentials.map((credential) => ({
          ...credential,
          id: base64urlToBuffer(credential.id),
        }))
      }
      return options
    }

    function assertionToJSON(credential) {
      return {
        id: credential.id,
        rawId: bufferToBase64url(credential.rawId),
        type: credential.type,
        response: {
          authenticatorData: bufferToBase64url(credential.response.authenticatorData),
          clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
          signature: bufferToBase64url(credential.response.signature),
          userHandle: bufferToBase64url(credential.response.userHandle),
        },
        clientExtensionResults: credential.getClientExtensionResults(),
      }
    }

    function showMessage(message) {
      document.querySelector("#message").textContent = message
      document.querySelector(".notification")?.classList.remove("is-hidden")
    }

    async function startLogin() {
      document.querySelector(".notification")?.classList.add("is-hidden")
      try {
        const optionsResponse = await fetch("/auth/api/passkey/login/options", {
          method: "post",
          cache: "no-cache",
        })
        if (!optionsResponse.ok) {
          showMessage("パスキーログインを開始できませんでした")
          return
        }

        const options = requestOptionsFromJSON(await optionsResponse.json())
        const assertion = await navigator.credentials.get(options)
        const verifyResponse = await fetch("/auth/api/passkey/login/verify", {
          method: "post",
          cache: "no-cache",
          body: JSON.stringify(assertionToJSON(assertion)),
        })
        if (verifyResponse.ok) {
          window.location.href = "/"
          return
        }
        showMessage("パスキーログインに失敗しました")
      } catch (e) {
        showMessage("パスキーログインに失敗しました")
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      startLogin()
    })
  </script>
  <style>
    :root {
      --body-background-color: #020617;
      --body-color: #e8fbff;
      --color-primary-contract: #e8fbff;
      --color-primary: #19c7d5;
      --color-error: #ff6b9a;
      --color-error-contract: #1b0610;
      --panel-bg-color: #081425;
      --panel-border-color: #174782;
    }

    body {
      background-color: var(--body-background-color);
      color: var(--body-color);
      margin: 0;
    }

    main {
      margin: 0 auto;
      max-width: 44em;
    }

    header {
      background: linear-gradient(90deg, #030817 0%, #071d3d 48%, #06323c 100%);
      border-bottom: 1px solid rgba(25, 199, 213, 0.35);
      box-shadow: 0 16px 40px rgba(2, 6, 23, 0.5);
      padding: 0.7em 1em;
      margin-bottom: 1.5em;
    }

    header>.title {
      color: var(--color-primary-contract);
      font-family: Anton, sans-serif;
      font-weight: 700;
      font-size: 1.5em;
    }

    header>.sub-title {
      color: #7ddff0;
    }

    .panel {
      background-color: var(--panel-bg-color);
      border: 1px solid var(--panel-border-color);
      border-radius: 0.5em;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.36);
      margin: 2em;
    }

    .panel>.title {
      color: var(--color-primary);
      font-weight: 600;
      margin: 0.25em;
    }

    .panel>.content {
      display: flex;
      flex-direction: column;
      gap: 0.75em;
      margin: 1em;
    }

    .notification {
      background-color: var(--color-error);
      border-radius: 0.45em;
      color: var(--color-error-contract);
      padding: 0.65em 0.75em;
    }

    .is-hidden {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <span class="title">modern-utopia.net</span>
    <span class="sub-title">In the beginning was the name</span>
  </header>
  <main>
    <div class="panel">
      <div class="title">passkey login</div>
      <div class="content">
        <div id="message" class="notification is-hidden"></div>
      </div>
    </div>
  </main>
</body>

</html>
